    <path d="M64 24C64 24 74 42 74 54C74 59.52 71.76 64.53 68.14 68.14C64.53 71.76 64 78 64 78C64 78 58 72 58 64C58 56 64 48 64 48C64 48 44 60 44 76C44 91.46 52.94 104 64 104C75.06 104 84 91.46 84 76C84 56 64 24 64 24Z" fill="url(#flameGrad)"/>
